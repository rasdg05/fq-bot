name: CI

on:
  push:
    branches: ["**"]
  # Sin trigger 'pull_request': push:["**"] ya corre el CI en cada commit de CADA rama
  # (incluida la del PR). El trigger pull_request solo duplicaba el run y su copia fallaba
  # al iniciar (startup_failure en cada PR -> notificaciones falsas). Repo de un dueño, sin
  # forks -> el push cubre toda la cobertura. RasDG 2026-07-08.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Pytest suite
        run: pytest tests/ -q

      - name: Self-tests embebidos del motor
        run: |
          python emergent_time.py
          python quantum_timelines.py
          python battle_planner.py

      - name: Smoke import de modulos de cara al cliente
        run: |
          python -c "import branding, legal, ledger_stats, fq_logging, vip_format, public_format, public_content_generator, public_handlers, public_outcome_announcer"
          python -c "from ops import heartbeat, backup_ledger, maintenance"

  # ENGINEERING_PLAN N1 — valida el SET CONGELADO (requirements.lock) en 3.12:
  # instala bit-a-bit del lock, comprueba conflictos (pip check) y corre la suite.
  # Guarda de reproducibilidad: si el lock se rompe (o queda desfasado de lo que
  # requirements.txt resuelve), este job se pone ROJO antes de tocar prod.
  lockcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install desde requirements.lock (set congelado)
        run: |
          # libgomp1: runtime OpenMP que numba (via pandas-ta) puede necesitar.
          sudo apt-get update && sudo apt-get install -y libgomp1
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check

      - name: Pytest suite (desde el lock)
        run: pytest tests/ -q

