name: Cross-asset cosecha (10 curadas, Hetzner) — tandas

# UN TAP por TANDA. Cosecha el cube (alta densidad: 84m / step1) de los símbolos elegidos
# para el barrido CROSS-ASSET — la tesis del "premio": ¿la fuerza del edge de persistencia/
# impacto ESCALA con la institucional-idad / order-splitting del activo? Para mapear esa curva
# necesitamos SPREAD (de institucional a retail) y DATA PROFUNDA por símbolo.
#
# Ancla que ya tenemos: BTC (institucional, F2 apiló) · SOL (retail-ish, NO apiló) · ETH (en curso).
#
# LAS 10 CURADAS (todas ~2020 de inception en perp -> ~5-6 años, cube DENSO de verdad), por
# espectro institucional -> retail:
#   institucional/lento (tipo BTC):  LTC, BCH
#   large-cap alts (medio):          BNB, LINK, DOT, ADA, AVAX
#   retail/alta-velocidad:           XRP, DOGE, TRX
# EXCLUIDAS a propósito (poca historia -> cube fino, ruido para la tesis): SUI, APT, ARB, OP,
# TON, INJ, NEAR. RasDG: "hay crypto con menos historia... no apostemos 2 días a algo que sale fino".
#
# TANDAS (1 runner = serie, ~2-3h c/u; el CCX33 debe quedarse ON la tanda):
#   Tanda 1 (default, espectro extremo para señal temprana): DOGE, XRP, LTC, BCH, BNB
#   Tanda 2 (los medios): LINK, DOT, ADA, AVAX, TRX
#   (o 3+3+4 si prefieres lotes más chicos — edita 'symbols').
#
# Cada cube sale como ARTEFACTO; Claude lo baja y commitea a cosecha_cubes/ conforme cae.
# Si quedan en Queued: confirma que el runner Hetzner esté ONLINE/Idle.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Tanda a cosechar (CSV con /USDT). Default = Tanda 1. Para Tanda 2 edita a: LINK/USDT,DOT/USDT,ADA/USDT,AVAX/USDT,TRX/USDT"
        default: "DOGE/USDT,XRP/USDT,LTC/USDT,BCH/USDT,BNB/USDT"
      sym_months:
        description: "Meses de historia (mismo valor para toda la tanda). 84 = máximo. OJO: símbolos jóvenes en OKX dan n=0 si pides antes de su listing (como SOL=60, ETH=76). DOGE/USDT no llega a 84 -> re-disparar SOLO DOGE con 54."
        default: "84"

permissions:
  actions: write      # para disparar research.yml por símbolo
  contents: read

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disparar Research (cosecha sym_months/step1) por símbolo — se encolan en Hetzner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=',' read -ra SYMS <<< "${{ inputs.symbols }}"
          n=0
          for S in "${SYMS[@]}"; do
            S=$(echo "$S" | tr -d ' ')
            [ -z "$S" ] && continue
            echo "== disparando cosecha: $S =="
            gh workflow run research.yml \
              --repo "${{ github.repository }}" \
              --ref claude/turbovec-tp-cube-hardening-fvzdx7 \
              -f symbol="$S" \
              -f cosecha=true \
              -f sym_months=${{ inputs.sym_months }} \
              -f sym_step=1 \
              && n=$((n+1)) || echo "  (falló el dispatch de $S)"
            sleep 2
          done
          echo "OK: $n cosechas disparadas (Tanda). Corren EN SERIE en el runner self-hosted (Hetzner)."
          echo "Mira Actions -> 'Research'. Si quedan en Queued: confirma que el CCX33 esté ONLINE/Idle."
          echo "Cada cube sale como artefacto; Claude los baja y commitea a cosecha_cubes/ conforme caen."
