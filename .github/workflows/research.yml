name: Research (backtest / walk-forward / poda)

# Corre el harness de research y publica el reporte como artefacto.
#
# - Manual (workflow_dispatch): elige exchange, ventana y parametros.
# - Semanal (schedule): regenera el track record OOS solo.
#
# Datos: OHLCV publico via ccxt (NO requiere secretos/API keys). Binance suele
# bloquear los runners de GitHub (HTTP 451), por eso el default es OKX (mas
# permisivo con runners cloud que Bybit).
#
# El job NUNCA falla por el run real: el demo sintetico es la red de seguridad
# verde y siempre deja un artefacto. El run real corre con continue-on-error y
# vuelca su salida (y cualquier traceback) al mismo artefacto para diagnostico.

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange ccxt (okx/bybit/binance)"
        default: "okx"
        type: string
      symbol:
        description: "Simbolo"
        default: "SOL/USDT"
        type: string
      months:
        description: "Meses de histgrico a descargar"
        default: "24"
        type: string
      step:
        description: "Evaluar 1 de cada N velas (1 = cada vela, mas senales)"
        default: "1"
        type: string
      max_bars:
        description: "Horizonte de la barrera vertical (velas 15m)"
        default: "96"
        type: string
      n_splits:
        description: "Folds walk-forward (guard pide n_splits*3 senales)"
        default: "7"
        type: string
      retrieval:
        description: "Activar diagnostico read-only de retrieval (k-NN causal)"
        default: "true"
        type: string
      retrieval_backend:
        description: "Backend de retrieval (exact/turbovec)"
        default: "exact"
        type: string
      retrieval_k:
        description: "k vecinos del retrieval"
        default: "50"
        type: string
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Defaults benignos para que el monolito importe sin secretos reales.
      TELEGRAM_TOKEN: "ci-dummy"
      TELEGRAM_TOKEN_PUBLIC: "ci-dummy"
      TELEGRAM_CHAT_ID: "0"
      ANTHROPIC_API_KEY: "ci-dummy"
      FQ_LEDGER_PATH: "/tmp/fq_ledger_ci.db"
      EX: ${{ github.event.inputs.exchange || 'okx' }}
      SYM: ${{ github.event.inputs.symbol || 'SOL/USDT' }}
      MONTHS: ${{ github.event.inputs.months || '24' }}
      STEP: ${{ github.event.inputs.step || '1' }}
      MAXBARS: ${{ github.event.inputs.max_bars || '96' }}
      NSPLITS: ${{ github.event.inputs.n_splits || '7' }}
      RETRIEVAL: ${{ github.event.inputs.retrieval || 'true' }}
      RBACKEND: ${{ github.event.inputs.retrieval_backend || 'exact' }}
      RK: ${{ github.event.inputs.retrieval_k || '50' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest lightgbm turbovec

      - name: Sanity — suite de research (incluye test de leakage de retrieval)
        run: pytest tests/test_bt_*.py -q

      # Cachea los Parquet por exchange+symbol+meses para NO re-descargar 48m de
      # historia en cada run (clave para BTC: descarga una vez, reusa).
      - name: Cache de datasets OHLCV
        uses: actions/cache@v4
        with:
          path: data
          key: ohlcv-${{ env.EX }}-${{ env.SYM }}-${{ env.MONTHS }}m-v1

      - name: Demo sintetico (red de seguridad, siempre verde)
        run: |
          mkdir -p research_out
          python tools/research_demo.py | tee research_out/demo_synthetic.txt

      - name: Descargar histgrico real (OHLCV publico)
        id: download
        continue-on-error: true
        run: |
          YEARS=$(python -c "print(round(${MONTHS}/12.0, 4))")
          for TF in 15m 1h 4h; do
            echo "== descargando ${SYM} ${TF} (${MONTHS} meses, ${EX}) =="
            python tools/build_dataset.py --symbol "${SYM}" --timeframe "${TF}" \
              --market swap --years "${YEARS}" --exchanges "${EX}" \
              2>&1 | tee -a research_out/download.txt
          done

      - name: Research real (motor de produccion + retrieval read-only)
        continue-on-error: true
        run: |
          RFLAG=""
          if [ "${RETRIEVAL}" = "true" ]; then
            RFLAG="--retrieval --retrieval-backend ${RBACKEND} --retrieval-k ${RK}"
          fi
          python tools/run_research_real.py --exchange "${EX}" --symbol "${SYM}" \
            --step "${STEP}" --max-bars "${MAXBARS}" \
            --n-splits "${NSPLITS}" --embargo 8 --seed 42 ${RFLAG} \
            2>&1 | tee research_out/research_real.txt

      - name: Empaquetar reporte
        if: always()
        run: |
          {
            echo "# Reporte de research FQ"
            echo "fecha: $(date -u +%FT%TZ)  exchange: ${EX}  symbol: ${SYM}  meses: ${MONTHS}"
            echo ""
            echo "## Real (motor de produccion)"; echo '```'
            cat research_out/research_real.txt 2>/dev/null || echo "(no disponible — ver download.txt)"
            echo '```'
            echo "## Demo sintetico (sanity)"; echo '```'
            cat research_out/demo_synthetic.txt 2>/dev/null || echo "(no disponible)"
            echo '```'
          } > research_out/REPORTE.md

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report
          path: research_out/
          retention-days: 90

  # Si el job 'research' falla en rojo (infra o regresion real de la suite, ya
  # que los pasos de datos/run real son continue-on-error), abre/actualiza un
  # Issue con el link al run. Asi el fallo del run semanal NUNCA es silencioso y
  # queda como notificacion permanente de GitHub para revisarlo (o pedirle a
  # Claude que lo diagnostique con las tools de Actions).
  notify-failure:
    needs: research
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir/actualizar Issue de fallo
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "Research run fallo";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `El workflow **Research** fallo en rojo.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Commit: \`${context.sha}\``,
              ``,
              `Revisa los logs del run y el artefacto \`research-report\`.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open",
              per_page: 100,
            });
            const existing = open.data.find(i => i.title.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `⚠️ ${marker} (${context.eventName})`, body,
              });
            }
