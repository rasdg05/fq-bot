name: Research (backtest / walk-forward / poda)

# Corre el harness de research (runner turbovec) y publica el reporte como
# artefacto. CLICK-TO-RUN: con solo darle "Run workflow" corre BTC y SOL en
# PARALELO, intradia (TF 5m), recolectando TODA la data gratis post-replay
# (frontera TP x horizonte, grid SL/TP, gate VIP, retrieval k-NN read-only).
#
# - Manual (workflow_dispatch): los defaults ya son los buenos; no hace falta
#   tocar nada. Los inputs son para experimentar.
# - Semanal (schedule): regenera BTC+SOL OOS con datos frescos.
#
# Datos: OHLCV publico via ccxt (NO requiere secretos). Binance da HTTP 451 en
# runners; el default es OKX (swap perpetuo, casa funding entre BTC y SOL).
#
# Paralelismo y presupuesto de CI:
#   - matrix por simbolo: BTC (48m) y SOL (24m) como jobs concurrentes, cada uno
#     con su propio techo de 350min. fail-fast=false: que uno falle no mata al otro.
#   - cadencia intradia via TF 5m (el TF, no el step, es la palanca principal:
#     5m da ~3x la resolucion del viejo 15m). El step se mantiene en el rango
#     seguro de tiempo (BTC step=3, SOL step=2) para GARANTIZAR que el run
#     completa al primer click; bajalo (mas senales) si ves holgura de tiempo.
#   - cache de Parquet por simbolo+exchange+meses, rotando por SEMANA ISO: re-runs
#     dentro de la semana NO re-bajan 48m de velas; el run semanal baja frescas.
#
# El job NUNCA falla por el run real: el demo sintetico es la red verde y siempre
# deja artefacto. El run real corre con continue-on-error y vuelca su salida (y
# cualquier traceback) al artefacto para diagnostico.

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange ccxt (okx/bybit/binance)"
        default: "okx"
        type: string
      tf_id:
        description: "TF primario del motor (5m = intradia, mas senales; 15m = mas rapido)"
        default: "5m"
        type: choice
        options: ["5m", "15m"]
      max_bars:
        description: "Barrera vertical del label de win (velas; 5m: 288=24h intradia, 576=48h)"
        default: "288"
        type: string
      horizon_sweep:
        description: "Frontera TP a varios horizontes (velas, coma). Gratis post-replay. 5m: 96=8h 288=24h 576=48h"
        default: "96,288,576"
        type: string
      dense_horizon:
        description: "Velas forward del label de retorno en ATR (retrieval denso). 5m: 288=24h"
        default: "288"
        type: string
      n_splits:
        description: "Folds walk-forward (guard pide n_splits*3 senales)"
        default: "7"
        type: string
      target_level:
        description: "Barrera de ganancia = label de win. tp1 (~1R, WR balanceado, sin descartar eventos) recomendado."
        default: "tp1"
        type: choice
        options: ["tp1", "tp2", "tp3", "tp4"]
      seed:
        description: "Semilla del replay (reproducible; variala para muestrear)"
        default: "42"
        type: string
      retrieval:
        description: "Diagnostico read-only de retrieval (k-NN causal de expectancy por analogia)"
        default: "true"
        type: string
      retrieval_k:
        description: "k vecinos del retrieval"
        default: "50"
        type: string
      dense_query_step:
        description: "Subsamplea queries del retrieval denso (10 = 1 de cada 10; acota coste)"
        default: "10"
        type: string
      tp_sl_grid:
        description: "Grid post-replay SL(xATR) x TP + frontera TP x horizonte con costes/OOS (gratis)"
        default: "true"
        type: string
      quality_gate:
        description: "Gate VIP oro: decil superior OOS por score del modelo y expectancy del retrieval"
        default: "true"
        type: string
      vector_ablation:
        description: "EJE A: mide el LIFT del bloque quantum (kappa/sigma_tau/sync/campo) en el edge de retrieval (barato, sobre señales fired)"
        default: "true"
        type: string
      emergent_time:
        description: "EJE A experimental: replay con FQ_EMERGENT_TIME_ENABLED=1 (sync/sigma_tau VIVOS). OJO: cambia el set de señales. Default OFF."
        default: false
        type: boolean
      out_of_time:
        description: "PROOF OF WORK: fecha de corte (p.ej. 2025-09-01) para la prueba forward out-of-time + calibración. Vacío = off."
        default: ""
        type: string
      ablation:
        description: "OPT-IN: poda de modulos = 3 replays EXTRA (triplica el coste). Default OFF (no es gratis)."
        default: false
        type: boolean
      cosecha:
        # Cosecha cross-simbolo cosechada OK en #36 (BTC) + #38 (SOL); default de
        # vuelta en false (un cosecha=true dispara 1-2h en el runner self-hosted).
        description: "F3: COSECHA cross-simbolo BTC+SOL a MAXIMA DATA / step1 (sharded en self-hosted)."
        default: false
        type: boolean
      data_only:
        description: "Solo descargar histgrico y omitir el replay (preparar/validar datos de un simbolo)"
        default: false
        type: boolean
      build_index:
        description: "F2: persiste el gate ORO (indice retrieval + umbral, top_pct) en el artefacto. Reusa el MISMO replay (sin coste extra de motor)."
        default: false
        type: boolean
      gold_top_pct:
        description: "Percentil que define ORO (0.05 = top 5%, lo validado en F1)."
        default: "0.05"
        type: string
      segment_veto_killzones:
        description: "F2.6 §6.8: veto de sesion INTEGRADO en el replay (CSV killzones, p.ej. london_open_kz). Vacio = sin veto. Mide OOS/frontera/segmentos de la poblacion restante."
        default: ""
        type: string
      segment_veto_utc_blocks:
        description: "F2.6: veto secundario por bloque-UTC 4h (CSV, p.ej. 00-04,04-08). Vacio = off."
        default: ""
        type: string
      segment_veto_weekdays:
        description: "F2.6: veto secundario por dia (CSV: lun,mar,...). Vacio = off."
        default: ""
        type: string
      symbol:
        description: "Cosechar UN simbolo arbitrario (p.ej. ETH/USDT). Vacio = matriz normal (BTC/SOL). Corre en GitHub-hosted con scope reducido (sin Hetzner)."
        default: ""
        type: string
      sym_months:
        description: "Meses de historia para --symbol (default 24; cabe bajo el techo de 6h de GitHub-hosted)."
        default: "24"
        type: string
      sym_step:
        description: "Step del replay para --symbol (default 2)."
        default: "2"
        type: string
      decouple:
        description: "Decoupling §6.6: mide el edge del gate ORO SIN scorer/regime (CSV, p.ej. scorer,regime). Vacío = off. Decide si un módulo ACOPLADO se puede cortar del motor."
        default: ""
        type: string
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC

permissions:
  contents: read

jobs:
  research:
    # PESADOS (cosecha=true O ablation=true) -> runner SELF-HOSTED (Hetzner, sin
    # el tope de 6h de GitHub). El runner debe estar ONLINE antes de lanzar (si
    # no, el job queda en cola). El resto (normal/schedule) sigue en
    # ubuntu-latest (gratis, GitHub-hosted).
    runs-on: ${{ (github.event.inputs.cosecha == 'true' || github.event.inputs.ablation == 'true') && 'self-hosted' || 'ubuntu-latest' }}
    # PODA (ablation=true): baseline + 3 toggles = 4 replays. En GitHub-hosted la
    # corrida #40 se corto SIN veredicto al chocar el techo de 350min (BTC 48m
    # ~4h/replay -> ~16h). Por eso ahora la poda va a self-hosted (sin techo). La
    # MATRIZ (abajo) la corre SOLO en SOL 24m: la poda se decide primero en SOL
    # (BTC no es candidato, §6.5) y a step=3 via EFF_STEP -> ~horas en Hetzner.
    # NOTA: la matriz va en fromJSON y NO en jobs.<id>.if (el contexto `matrix`
    # no existe en el if de job). En schedule los inputs llegan vacios -> matriz
    # normal completa, sin cambios.
    # SELF-HOSTED: techo 2880 min (48h). Cosecha ~18-22h/simbolo; poda ~horas.
    timeout-minutes: ${{ (github.event.inputs.cosecha == 'true' || github.event.inputs.ablation == 'true') && 2880 || 350 }}
    strategy:
      fail-fast: false
      # BTC: 48 meses (densidad para el retrieval), step=3 = rango seguro de tiempo.
      # SOL: 24 meses (dataset mas chico) -> mas cadencia (step=2).
      # COSECHA (cosecha=true): BTC 84m + SOL 60m a step1 (maxima densidad). Ambos
      # cosechados y validados OK (#36 BTC=1311 eventos / 7 anios; #38 SOL=981 /
      # 5 anios). SOL topa en 60m porque SOL-USDT-SWAP en OKX listo 2021-01-22:
      # pedir mas (->antes del listing) hace que build_dataset baje n=0. BTC llega
      # a 2019 sin problema. PODA (ablation=true): solo SOL 24m.
      # Normal: BTC 48m + SOL 24m. Prioridad: cosecha > ablation > normal.
      # symbol (override) > cosecha > ablation > normal. symbol vacio/null es FALSY
      # -> cae a la matriz original SIN cambios (schedule/normal/cosecha/ablation
      # quedan intactos). symbol seteado -> UN solo simbolo en GitHub-hosted con
      # sym_months/sym_step. runs-on/timeout van a self-hosted con cosecha O ablation.
      matrix: ${{ fromJSON(github.event.inputs.symbol
        && format('{{"include":[{{"symbol":"{0}","months":"{1}","step":"{2}"}}]}}', github.event.inputs.symbol, github.event.inputs.sym_months, github.event.inputs.sym_step)
        || (github.event.inputs.cosecha == 'true'
        && '{"include":[{"symbol":"BTC/USDT","months":"84","step":"1"},{"symbol":"SOL/USDT","months":"60","step":"1"}]}'
        || (github.event.inputs.ablation == 'true'
        && '{"include":[{"symbol":"SOL/USDT","months":"24","step":"2"}]}'
        || '{"include":[{"symbol":"BTC/USDT","months":"48","step":"3"},{"symbol":"SOL/USDT","months":"24","step":"2"}]}'))) }}
    env:
      # Defaults benignos para que el monolito importe sin secretos reales.
      TELEGRAM_TOKEN: "ci-dummy"
      TELEGRAM_TOKEN_PUBLIC: "ci-dummy"
      TELEGRAM_CHAT_ID: "0"
      ANTHROPIC_API_KEY: "ci-dummy"
      FQ_LEDGER_PATH: "/tmp/fq_ledger_ci.db"
      # Gate DETERMINISTA en research: con el ledger vacio de CI, el Thompson
      # sampling hace que kappa sea un draw aleatorio y el set de senales dependa
      # del SEED (ruido del RNG, no estrategia). Con =0 el gate usa kappa
      # legacy_v2 determinista -> set de senales reproducible y atribuible a la
      # estrategia. Imprescindible para research honesto.
      FQ_USE_THOMPSON: "0"
      # --- por simbolo (matrix) ---
      SYM: ${{ matrix.symbol }}
      MONTHS: ${{ matrix.months }}
      STEP: ${{ matrix.step }}
      # --- globales (inputs con default; el schedule usa el default) ---
      EX: ${{ github.event.inputs.exchange || 'okx' }}
      TFID: ${{ github.event.inputs.tf_id || '5m' }}
      MAXBARS: ${{ github.event.inputs.max_bars || '288' }}
      HSWEEP: ${{ github.event.inputs.horizon_sweep || '96,288,576' }}
      DHORIZON: ${{ github.event.inputs.dense_horizon || '288' }}
      NSPLITS: ${{ github.event.inputs.n_splits || '7' }}
      TARGETLVL: ${{ github.event.inputs.target_level || 'tp1' }}
      SEED: ${{ github.event.inputs.seed || '42' }}
      RETRIEVAL: ${{ github.event.inputs.retrieval || 'true' }}
      RK: ${{ github.event.inputs.retrieval_k || '50' }}
      DQSTEP: ${{ github.event.inputs.dense_query_step || '10' }}
      TPSLGRID: ${{ github.event.inputs.tp_sl_grid || 'true' }}
      QGATE: ${{ github.event.inputs.quality_gate || 'true' }}
      VABL: ${{ github.event.inputs.vector_ablation || 'true' }}
      ETIME: ${{ github.event.inputs.emergent_time || false }}
      OOT: ${{ github.event.inputs.out_of_time || '' }}
      ABLATION: ${{ github.event.inputs.ablation || false }}
      COSECHA: ${{ github.event.inputs.cosecha || false }}
      DATAONLY: ${{ github.event.inputs.data_only || false }}
      # NOTA: el formulario "Run workflow" renderiza los inputs desde la rama por
      # DEFECTO (main), no desde la rama seleccionada -> 'build_index' no aparece
      # hasta que esto aterrice en main. Y NO se puede usar
      # `${{ inputs.build_index || 'true' }}`: GitHub rellena el input con su
      # default declarado ('false'), y la CADENA "false" es truthy en expresiones
      # -> gana el ||. Por eso, en esta rama, BUILDIDX va HARDCODEADO a true (el
      # build se condiciona ademas a retrieval=true en el step). Al mergear a main,
      # volver a `${{ github.event.inputs.build_index || false }}`.
      BUILDIDX: "true"
      GOLDPCT: ${{ github.event.inputs.gold_top_pct || '0.05' }}
      # F2.6 §6.8 — veto de sesion INTEGRADO. run_research_real lee estas envs via
      # segment_veto.from_env() y filtra la poblacion etiquetada ANTES de OOS /
      # frontera maker / segmentos / retrieval -> el run mide el veto integrado
      # (reproduce el regrade offline). Vacio = sin veto (baseline normal).
      FQ_SEGMENT_VETO_KILLZONES: ${{ github.event.inputs.segment_veto_killzones || '' }}
      FQ_SEGMENT_VETO_UTC_BLOCKS: ${{ github.event.inputs.segment_veto_utc_blocks || '' }}
      FQ_SEGMENT_VETO_WEEKDAYS: ${{ github.event.inputs.segment_veto_weekdays || '' }}
      # Decoupling §6.6 del gate ORO (vacío = off -> vector_variants normal).
      FQ_RETRIEVAL_DECOUPLE: ${{ github.event.inputs.decouple || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.cosecha != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Python 3.12 via uv (self-hosted / OS nuevo sin build de setup-python)
        # En la cosecha (runner self-hosted, Ubuntu 26.04) actions/setup-python no
        # tiene build de 3.12 -> falla en ~30s. uv baja un Python 3.12 portable
        # (OS-agnostico) y crea un venv con pip (--seed) que el resto de steps usa
        # via $GITHUB_PATH. Asi 'python'/'pip' resuelven al 3.12 del venv.
        # --clear: en el self-hosted $HOME persiste entre jobs; el 2do simbolo de
        # la matrix (corre en serie en el MISMO runner) encontraria el venv del 1ro
        # y 'uv venv' fallaria ("already exists"). --clear lo recrea idempotente.
        if: ${{ github.event.inputs.cosecha == 'true' }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          UV="$HOME/.local/bin/uv"
          "$UV" python install 3.12
          "$UV" venv --seed --clear --python 3.12 "$HOME/fqvenv"
          echo "$HOME/fqvenv/bin" >> "$GITHUB_PATH"
          "$HOME/fqvenv/bin/python" --version

      - name: Identificadores de simbolo (slug sin '/')
        # SLUG: artefactos y cache key sin '/' (upload-artifact@v4 lo prohibe y dos
        # jobs de la matrix NO pueden subir artefactos con el mismo nombre).
        run: echo "SLUG=$(echo "$SYM" | tr '/:' '__')" >> "$GITHUB_ENV"

      - name: Sello de semana ISO (rota la cache de datos)
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          # libgomp1: runtime OpenMP que lightgbm necesita para importar.
          sudo apt-get update && sudo apt-get install -y libgomp1 \
            || echo "[apt skip] sin sudo/apt (self-hosted): asume libgomp1 preinstalado"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # scikit-learn: LGBMClassifier vive en lightgbm.sklearn y lo necesita.
          # Sin el, 'import lightgbm' pasa (verde) pero make_lgbm_classifier truena
          # y el modelo [3/4] se degrada en SILENCIO (el runner lo nombra ahora,
          # pero el assert de abajo lo hace rojo de install, no reporte sin modelo).
          # turbovec: backend ANN del retrieval denso (100k+ estados).
          pip install pytest lightgbm scikit-learn turbovec
          python -c "import lightgbm, sklearn; from lightgbm import LGBMClassifier; LGBMClassifier(); print('lightgbm', lightgbm.__version__, 'sklearn', sklearn.__version__, 'OK')"

      - name: Sanity — suite de research (incluye test de leakage de retrieval)
        run: pytest tests/test_bt_*.py -q

      - name: Cache de datasets OHLCV (rota por semana)
        uses: actions/cache@v4
        with:
          path: data
          key: ohlcv-${{ env.EX }}-${{ env.SLUG }}-${{ env.MONTHS }}m-${{ steps.stamp.outputs.week }}

      - name: Demo sintetico (red de seguridad, siempre verde)
        run: |
          mkdir -p research_out
          python tools/research_demo.py | tee research_out/demo_synthetic.txt

      - name: Descargar histgrico real (OHLCV publico)
        id: download
        continue-on-error: true
        run: |
          YEARS=$(python -c "print(round(${MONTHS}/12.0, 4))")
          # Stack de TFs segun el TF primario (ver TF_STACK en el runner).
          if [ "${TFID}" = "5m" ]; then DL_TFS="5m 15m 1h"; else DL_TFS="15m 1h 4h"; fi
          for TF in ${DL_TFS}; do
            P=$(python -c "import bt_data; print(bt_data.dataset_path('data', '${EX}', '${SYM}', '${TF}'))")
            if [ -f "$P" ]; then
              echo "== cache hit ${SYM} ${TF}: $P (omito descarga) ==" \
                | tee -a research_out/download.txt
              continue
            fi
            echo "== descargando ${SYM} ${TF} (${MONTHS} meses, ${EX}) ==" \
              | tee -a research_out/download.txt
            python tools/build_dataset.py --symbol "${SYM}" --timeframe "${TF}" \
              --market swap --years "${YEARS}" --exchanges "${EX}" \
              2>&1 | tee -a research_out/download.txt
          done

      - name: Subir dataset (solo modo data_only)
        if: ${{ env.DATAONLY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ env.SLUG }}
          path: data/
          retention-days: 90

      - name: Research real (motor de produccion + retrieval read-only)
        if: ${{ env.DATAONLY != 'true' }}
        continue-on-error: true
        run: |
          # UNIFICADO: el replay es DENSO -> UN replay del motor alimenta el
          # research de senales (subset fired: frontera + modelo) Y el retrieval
          # denso (todas las velas). Todo lo demas es post-replay (gratis).
          #
          # MODO PODA (ablation=true): el run queda configurado SOLO para el
          # veredicto de poda, sin tocar mas inputs en el form: los extras
          # (retrieval / grids / gate VIP / ablacion de vector) se fuerzan OFF
          # aqui y todo el presupuesto va a los 4 replays (baseline + 3
          # toggles). El funnel [1.4/4] y el cubo TPxH no cuestan replays y
          # siguen ON. Esto vive AQUI y no en los `default:` de los inputs
          # porque el form de la UI renderiza los defaults de MAIN.
          if [ "${ABLATION}" = "true" ]; then
            RETRIEVAL="false"; TPSLGRID="false"; QGATE="false"; VABL="false"
            echo "== MODO PODA: solo SOL (matriz dinamica), step efectivo=3,"
            echo "   retrieval/tp_sl_grid/quality_gate/vector_ablation -> OFF =="
          fi
          ABLATION_FLAG=""
          [ "${ABLATION}" = "true" ] && ABLATION_FLAG="--ablation"   # opt-in: 3 replays extra
          RFLAG=""
          if [ "${RETRIEVAL}" = "true" ]; then
            RFLAG="--retrieval --retrieval-backend turbovec --retrieval-k ${RK} --retrieval-query-step ${DQSTEP} --retrieval-json research_out/retrieval_${SLUG}.json"
          fi
          GRIDFLAG=""
          [ "${TPSLGRID}" = "true" ] && GRIDFLAG="--tp-sl-grid"
          QGATEFLAG=""
          [ "${QGATE}" = "true" ] && QGATEFLAG="--quality-gate"
          # EJE A: ablación de vector (base vs +quantum) y, opcional, Phase E.
          VABLFLAG=""
          [ "${VABL}" = "true" ] && VABLFLAG="--vector-ablation"
          ETIMEFLAG=""
          [ "${ETIME}" = "true" ] && ETIMEFLAG="--emergent-time"
          OOTFLAG=""
          [ -n "${OOT}" ] && OOTFLAG="--out-of-time ${OOT}"
          IDXFLAG=""
          # F2: persiste el gate ORO desde ESTE replay (sin replay extra). Requiere
          # retrieval ON (de el sale el OOS denso que calibra el umbral).
          [ "${BUILDIDX}" = "true" ] && [ "${RETRIEVAL}" = "true" ] && IDXFLAG="--build-index --index-out research_out/retrieval/${SLUG} --gold-top-pct ${GOLDPCT}"
          EQJSON="research_out/equity_${SLUG}.json"
          # PODA: 4 replays deben caber en el techo de 350min. A step=2 SOL va al
          # filo (~5h45); step=3 cierra en ~4h con ~420 senales por variante
          # (suficiente para el veredicto VIVE/MATAR por modulo).
          EFF_STEP="${STEP}"
          [ "${ABLATION}" = "true" ] && EFF_STEP="3"
          if [ "${COSECHA}" = "true" ]; then
            # COSECHA SHARDED: parte el replay por fecha en N=nproc shards
            # paralelos (cube-only, sin retrieval). El cubo merged sube como
            # artefacto research-report-<sym> igual que siempre.
            NSHARDS=$(nproc)
            echo "== COSECHA SHARDED ${SYM}: ${NSHARDS} shards en paralelo =="
            python tools/cosecha_shard.py --exchange "${EX}" --symbol "${SYM}" \
              --tf-id "${TFID}" --shards "${NSHARDS}" --workers "${NSHARDS}" \
              --step "${STEP}" --max-bars "${MAXBARS}" --n-splits "${NSPLITS}" \
              --embargo 8 --seed "${SEED}" --horizon-sweep "${HSWEEP}" \
              --out "research_out/tp_cube_${SLUG}.parquet" \
              2>&1 | tee research_out/research_real.txt
          else
            python tools/run_research_real.py --exchange "${EX}" --symbol "${SYM}" \
              --tf-id "${TFID}" --target-level "${TARGETLVL}" \
              --horizon-sweep "${HSWEEP}" --dense-horizon "${DHORIZON}" \
              --tp-cube-out "research_out/tp_cube_${SLUG}.parquet" \
              --segments-out "research_out/segments_${SLUG}.csv" \
              --step "${EFF_STEP}" --max-bars "${MAXBARS}" \
              --seed "${SEED}" --n-splits "${NSPLITS}" --embargo 8 \
              ${ABLATION_FLAG} ${RFLAG} ${GRIDFLAG} ${QGATEFLAG} ${VABLFLAG} ${ETIMEFLAG} ${OOTFLAG} ${IDXFLAG} \
              --equity-json "${EQJSON}" \
              2>&1 | tee research_out/research_real.txt
          fi

      - name: Verificar cubo de cosecha (rojo honesto si vacio)
        # El step previo tiene continue-on-error + '| tee' -> el rc de
        # cosecha_shard se traga y el job iba VERDE aun sin cubo (paso en #37: SOL
        # bajo n=0 y subio un artefacto vacio "exitoso"). Este gate, SIN
        # continue-on-error, falla el job si la cosecha no produjo un cubo con
        # eventos. Solo aplica a la cosecha (no toca runs normales/poda).
        if: ${{ env.COSECHA == 'true' && env.DATAONLY != 'true' }}
        run: |
          CUBE="research_out/tp_cube_${SLUG}.parquet"
          if [ ! -s "$CUBE" ]; then
            echo "::error::cosecha sin cubo ($CUBE). Salida del replay:"
            cat research_out/research_real.txt 2>/dev/null || true
            exit 1
          fi
          python -c "import pandas as pd; n=pd.read_parquet('$CUBE')['entry_ts'].nunique(); print('cubo OK:', n, 'eventos'); assert n>0, 'cubo sin eventos'"

      - name: Empaquetar reporte
        if: always()
        run: |
          {
            echo "# Reporte de research FQ — ${SYM}"
            echo "fecha: $(date -u +%FT%TZ)  exchange: ${EX}  symbol: ${SYM}  meses: ${MONTHS}  tf: ${TFID}  step: ${STEP}"
            # Provenance (ENGINEERING_PLAN N5): sin esto, casar artefacto<->run<->codigo es arqueologia.
            echo "run: #${{ github.run_number }} (id ${{ github.run_id }})  sha: ${{ github.sha }}  branch: ${{ github.ref_name }}"
            echo ""
            echo "## Real (motor de produccion + retrieval)"; echo '```'
            cat research_out/research_real.txt 2>/dev/null || echo "(no disponible — ver download.txt)"
            echo '```'
            echo "## Demo sintetico (sanity)"; echo '```'
            cat research_out/demo_synthetic.txt 2>/dev/null || echo "(no disponible)"
            echo '```'
          } > research_out/REPORTE.md

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report-${{ env.SLUG }}
          path: research_out/
          retention-days: 90

  # Si el job 'research' falla en rojo (infra o regresion real de la suite, ya
  # que los pasos de datos/run real son continue-on-error), abre/actualiza un
  # Issue con el link al run. Asi el fallo del run semanal NUNCA es silencioso y
  # queda como notificacion permanente de GitHub para revisarlo (o pedirle a
  # Claude que lo diagnostique con las tools de Actions).
  notify-failure:
    needs: research
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir/actualizar Issue de fallo
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "Research run fallo";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `El workflow **Research** fallo en rojo.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Commit: \`${context.sha}\``,
              ``,
              `Revisa los logs del run y el artefacto \`research-report\`.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open",
              per_page: 100,
            });
            const existing = open.data.find(i => i.title.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `⚠️ ${marker} (${context.eventName})`, body,
              });
            }
