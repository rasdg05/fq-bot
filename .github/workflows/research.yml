name: Research (backtest / walk-forward / poda)

# Corre el harness de research y publica el reporte como artefacto.
#
# - Manual (workflow_dispatch): elige exchange, ventana y parametros.
# - Semanal (schedule): regenera el track record OOS solo.
#
# Datos: OHLCV publico via ccxt (NO requiere secretos/API keys). Binance suele
# bloquear los runners de GitHub (HTTP 451), por eso el default es OKX (mas
# permisivo con runners cloud que Bybit).
#
# El job NUNCA falla por el run real: el demo sintetico es la red de seguridad
# verde y siempre deja un artefacto. El run real corre con continue-on-error y
# vuelca su salida (y cualquier traceback) al mismo artefacto para diagnostico.

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange ccxt (okx/bybit/binance)"
        default: "okx"
        type: string
      symbol:
        description: "Simbolo"
        default: "SOL/USDT"
        type: string
      months:
        description: "Meses de histgrico a descargar"
        default: "24"
        type: string
      step:
        description: "Evaluar 1 de cada N velas (con tf_id=5m: 2 para SOL ~24m, 3 para BTC ~48m; cabe en 180min)"
        default: "2"
        type: string
      max_bars:
        description: "Horizonte de la barrera vertical (velas del TF primario; con tf_id=5m: 288=24h, 576=48h)"
        default: "576"
        type: string
      n_splits:
        description: "Folds walk-forward (guard pide n_splits*3 senales)"
        default: "7"
        type: string
      ablation:
        description: "Correr poda de modulos (3 re-replays, MUY lento; ruido con muestra chica)"
        default: false
        type: boolean
      seed:
        description: "Semilla del replay (gate = Thompson sampling). Fija = reproducible; variala para muestrear la distribucion"
        default: "42"
        type: string
      tf_id:
        description: "TF primario del motor (5m = mas volumen de senales, recomendado para retrieval; 15m = mas rapido)"
        default: "5m"
        type: choice
        options: ["5m", "15m"]
      target_level:
        description: "Barrera de ganancia = label de win (modelo + retrieval). tp1 = definicion del ledger (~1R, WR balanceado, sin descartar eventos). OJO tp3==tp2 en el motor; tp4 = unico target lejano real (entry+rng)."
        default: "tp1"
        type: choice
        options: ["tp1", "tp2", "tp3", "tp4"]
      horizon_sweep:
        description: "Frontera TP a varios horizontes (velas, coma). Post-replay: NO re-replica. Vacio = solo max_bars. p.ej. 96,288,576,864"
        default: ""
        type: string
      data_only:
        description: "Solo descargar histgrico (build_dataset) y omitir el replay. Para preparar/validar datos de un simbolo nuevo (p.ej. BTC). Sube el dataset como artefacto."
        default: false
        type: boolean
      retrieval:
        description: "Activar diagnostico read-only de retrieval (k-NN causal de expectancy por analogia)"
        default: "true"
        type: string
      retrieval_backend:
        description: "Backend de retrieval (exact = numpy fuente de verdad; turbovec = ANN 2/4-bit)"
        default: "exact"
        type: string
      retrieval_k:
        description: "k vecinos del retrieval"
        default: "50"
        type: string
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    # Baseline (replay + OOS + modelo) cabe sobre. La poda triplica el tiempo
    # (3 re-replays sobre ~70k velas), por eso es opt-in y el techo es holgado.
    timeout-minutes: 180
    env:
      # Defaults benignos para que el monolito importe sin secretos reales.
      TELEGRAM_TOKEN: "ci-dummy"
      TELEGRAM_TOKEN_PUBLIC: "ci-dummy"
      TELEGRAM_CHAT_ID: "0"
      ANTHROPIC_API_KEY: "ci-dummy"
      FQ_LEDGER_PATH: "/tmp/fq_ledger_ci.db"
      EX: ${{ github.event.inputs.exchange || 'okx' }}
      SYM: ${{ github.event.inputs.symbol || 'SOL/USDT' }}
      MONTHS: ${{ github.event.inputs.months || '24' }}
      STEP: ${{ github.event.inputs.step || '2' }}
      MAXBARS: ${{ github.event.inputs.max_bars || '576' }}
      NSPLITS: ${{ github.event.inputs.n_splits || '7' }}
      ABLATION: ${{ github.event.inputs.ablation || false }}
      SEED: ${{ github.event.inputs.seed || '42' }}
      TFID: ${{ github.event.inputs.tf_id || '5m' }}
      TARGETLVL: ${{ github.event.inputs.target_level || 'tp1' }}
      HSWEEP: ${{ github.event.inputs.horizon_sweep || '' }}
      DATAONLY: ${{ github.event.inputs.data_only || false }}
      RETRIEVAL: ${{ github.event.inputs.retrieval || 'true' }}
      RBACKEND: ${{ github.event.inputs.retrieval_backend || 'exact' }}
      RK: ${{ github.event.inputs.retrieval_k || '50' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          # libgomp1: runtime OpenMP que lightgbm necesita para importar.
          sudo apt-get update && sudo apt-get install -y libgomp1
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # scikit-learn: LGBMClassifier vive en lightgbm.sklearn y lo necesita.
          # Sin el, 'import lightgbm' pasa (verde) pero make_lgbm_classifier truena
          # y el modelo [3/4] se degrada en SILENCIO (run_research_real lo traga en
          # su try/except). El assert de abajo construye el classifier para que un
          # sklearn ausente sea rojo de install, no un reporte sin modelo.
          # turbovec: backend ANN del retrieval (wheel manylinux; backend por
          # defecto es exacto/numpy, asi que turbovec es opcional pero lo dejamos
          # listo para el test de aproximacion).
          pip install pytest lightgbm scikit-learn turbovec
          python -c "import lightgbm, sklearn; from lightgbm import LGBMClassifier; LGBMClassifier(); print('lightgbm', lightgbm.__version__, 'sklearn', sklearn.__version__, 'OK')"

      - name: Sanity — suite de research (incluye test de leakage de retrieval)
        run: pytest tests/test_bt_*.py -q

      # Cachea los Parquet por exchange+symbol+meses para NO re-descargar 48m de
      # historia en cada run (clave para BTC: descarga una vez, reusa).
      - name: Cache de datasets OHLCV
        uses: actions/cache@v4
        with:
          path: data
          key: ohlcv-${{ env.EX }}-${{ env.SYM }}-${{ env.MONTHS }}m-v1

      - name: Demo sintetico (red de seguridad, siempre verde)
        run: |
          mkdir -p research_out
          python tools/research_demo.py | tee research_out/demo_synthetic.txt

      - name: Descargar histgrico real (OHLCV publico)
        id: download
        continue-on-error: true
        run: |
          YEARS=$(python -c "print(round(${MONTHS}/12.0, 4))")
          # Stack de TFs a descargar segun el TF primario (ver TF_STACK en el runner).
          if [ "${TFID}" = "5m" ]; then DL_TFS="5m 15m 1h"; else DL_TFS="15m 1h 4h"; fi
          for TF in ${DL_TFS}; do
            echo "== descargando ${SYM} ${TF} (${MONTHS} meses, ${EX}) =="
            python tools/build_dataset.py --symbol "${SYM}" --timeframe "${TF}" \
              --market swap --years "${YEARS}" --exchanges "${EX}" \
              2>&1 | tee -a research_out/download.txt
          done

      - name: Subir dataset (solo modo data_only)
        if: ${{ env.DATAONLY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: data/
          retention-days: 90

      - name: Research real (motor de produccion + retrieval read-only)
        if: ${{ env.DATAONLY != 'true' }}
        continue-on-error: true
        run: |
          # La poda (3 re-replays) es opt-in: por defecto se omite con
          # --no-ablation para que el run quepa en tiempo y porque con muestra
          # chica sus deltas son ruido.
          ABLATION_FLAG="--no-ablation"
          [ "${ABLATION}" = "true" ] && ABLATION_FLAG=""
          # Retrieval read-only (no decide): expectancy por analogia + leakage.
          RFLAG=""
          if [ "${RETRIEVAL}" = "true" ]; then
            RFLAG="--retrieval --retrieval-backend ${RBACKEND} --retrieval-k ${RK} --retrieval-json research_out/retrieval_${SYM//\//-}.json"
          fi
          python tools/run_research_real.py --exchange "${EX}" --symbol "${SYM}" \
            --tf-id "${TFID}" --target-level "${TARGETLVL}" \
            --horizon-sweep "${HSWEEP}" \
            --step "${STEP}" --max-bars "${MAXBARS}" \
            --seed "${SEED}" --n-splits "${NSPLITS}" --embargo 8 ${ABLATION_FLAG} ${RFLAG} \
            2>&1 | tee research_out/research_real.txt

      - name: Empaquetar reporte
        if: always()
        run: |
          {
            echo "# Reporte de research FQ"
            echo "fecha: $(date -u +%FT%TZ)  exchange: ${EX}  symbol: ${SYM}  meses: ${MONTHS}"
            echo ""
            echo "## Real (motor de produccion)"; echo '```'
            cat research_out/research_real.txt 2>/dev/null || echo "(no disponible — ver download.txt)"
            echo '```'
            echo "## Demo sintetico (sanity)"; echo '```'
            cat research_out/demo_synthetic.txt 2>/dev/null || echo "(no disponible)"
            echo '```'
          } > research_out/REPORTE.md

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report
          path: research_out/
          retention-days: 90

  # Si el job 'research' falla en rojo (infra o regresion real de la suite, ya
  # que los pasos de datos/run real son continue-on-error), abre/actualiza un
  # Issue con el link al run. Asi el fallo del run semanal NUNCA es silencioso y
  # queda como notificacion permanente de GitHub para revisarlo (o pedirle a
  # Claude que lo diagnostique con las tools de Actions).
  notify-failure:
    needs: research
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir/actualizar Issue de fallo
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "Research run fallo";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `El workflow **Research** fallo en rojo.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Commit: \`${context.sha}\``,
              ``,
              `Revisa los logs del run y el artefacto \`research-report\`.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open",
              per_page: 100,
            });
            const existing = open.data.find(i => i.title.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `⚠️ ${marker} (${context.eventName})`, body,
              });
            }
