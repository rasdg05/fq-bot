name: Research (backtest / walk-forward / poda)

# Corre el harness de research y publica el reporte como artefacto.
#
# - Manual (workflow_dispatch): elige exchange, simbolos (matrix), ventana, etc.
# - Semanal (schedule): regenera el track record OOS de BTC y SOL en paralelo.
#
# Datos: OHLCV publico via ccxt (NO requiere secretos/API keys). Binance suele
# bloquear los runners de GitHub (HTTP 451), por eso el default es OKX (mas
# permisivo con runners cloud que Bybit).
#
# Paralelismo + ahorro de CI:
#   - matrix de simbolos: BTC y SOL corren como jobs concurrentes (1 dispatch).
#   - cache de datasets (data/): los Parquet OHLCV se cachean por
#     simbolo+exchange+ventana y rotan por SEMANA ISO. Asi, re-dispatches dentro
#     de la misma semana NO vuelven a bajar 24 meses de velas (el cuello de CI),
#     pero el run semanal siempre baja datos frescos.
#
# El job NUNCA falla por el run real: el demo sintetico es la red de seguridad
# verde y siempre deja un artefacto. El run real corre con continue-on-error y
# vuelca su salida (y cualquier traceback) al mismo artefacto para diagnostico.

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange ccxt (okx/bybit/binance)"
        default: "okx"
        type: string
      symbols:
        description: 'Simbolos como array JSON (matrix paralela)'
        default: '["BTC/USDT","SOL/USDT"]'
        type: string
      months:
        description: "Meses de histgrico a descargar"
        default: "24"
        type: string
      step:
        description: "Evaluar 1 de cada N velas (1 = cada vela, mas senales)"
        default: "1"
        type: string
      max_bars:
        description: "Horizonte de la barrera vertical (velas 15m)"
        default: "96"
        type: string
      n_splits:
        description: "Folds walk-forward (guard pide n_splits*3 senales)"
        default: "7"
        type: string
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # BTC y SOL corren en paralelo; que uno falle NO cancela al otro.
      fail-fast: false
      matrix:
        symbol: ${{ fromJSON(github.event.inputs.symbols || '["BTC/USDT","SOL/USDT"]') }}
    env:
      # Defaults benignos para que el monolito importe sin secretos reales.
      TELEGRAM_TOKEN: "ci-dummy"
      TELEGRAM_TOKEN_PUBLIC: "ci-dummy"
      TELEGRAM_CHAT_ID: "0"
      ANTHROPIC_API_KEY: "ci-dummy"
      FQ_LEDGER_PATH: "/tmp/fq_ledger_ci.db"
      EX: ${{ github.event.inputs.exchange || 'okx' }}
      SYM: ${{ matrix.symbol }}
      MONTHS: ${{ github.event.inputs.months || '24' }}
      STEP: ${{ github.event.inputs.step || '1' }}
      MAXBARS: ${{ github.event.inputs.max_bars || '96' }}
      NSPLITS: ${{ github.event.inputs.n_splits || '7' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Identificadores de simbolo (slug sin '/')
        # SLUG sirve para el nombre de artefacto (upload-artifact prohibe '/').
        run: echo "SLUG=$(echo "$SYM" | tr '/:' '__')" >> "$GITHUB_ENV"

      - name: Sello de semana ISO (rota la cache de datos)
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # lightgbm + scikit-learn juntos: LGBMClassifier vive en
          # lightgbm.sklearn y necesita scikit-learn (ver requirements-research).
          pip install -r requirements-research.txt

      - name: Assert — LGBMClassifier se construye (scikit-learn presente)
        # Falla en ROJO si el modelo esta degradado (import lightgbm verde pero
        # classifier no construye, p.ej. falta scikit-learn). Sin esto el run
        # real se lo traga en su try/except y el reporte sale sin AUC en
        # silencio. NO es continue-on-error a proposito.
        run: |
          python -c "import bt_train as t; m = t.make_lgbm_classifier(); \
            assert type(m).__name__ == 'LGBMClassifier', type(m); \
            print('OK LGBMClassifier construido:', type(m))"

      - name: Sanity — suite de research
        run: pytest tests/test_bt_*.py -q

      - name: Demo sintetico (red de seguridad, siempre verde)
        run: |
          mkdir -p research_out
          python tools/research_demo.py | tee research_out/demo_synthetic.txt

      - name: Cache de datasets OHLCV (rota por semana)
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ env.SLUG }}-${{ env.EX }}-${{ env.MONTHS }}m-${{ steps.stamp.outputs.week }}

      - name: Descargar histgrico real (OHLCV publico)
        id: download
        continue-on-error: true
        run: |
          YEARS=$(python -c "print(round(${MONTHS}/12.0, 4))")
          for TF in 15m 1h 4h; do
            P=$(python -c "import bt_data; print(bt_data.dataset_path('data', '${EX}', '${SYM}', '${TF}'))")
            if [ -f "$P" ]; then
              echo "== cache hit ${SYM} ${TF}: $P (omito descarga) ==" \
                | tee -a research_out/download.txt
              continue
            fi
            echo "== descargando ${SYM} ${TF} (${MONTHS} meses, ${EX}) ==" \
              | tee -a research_out/download.txt
            python tools/build_dataset.py --symbol "${SYM}" --timeframe "${TF}" \
              --market swap --years "${YEARS}" --exchanges "${EX}" \
              2>&1 | tee -a research_out/download.txt
          done

      - name: Research real (motor de produccion)
        continue-on-error: true
        run: |
          python tools/run_research_real.py --exchange "${EX}" --symbol "${SYM}" \
            --step "${STEP}" --max-bars "${MAXBARS}" \
            --n-splits "${NSPLITS}" --embargo 8 \
            2>&1 | tee research_out/research_real.txt

      - name: Empaquetar reporte
        if: always()
        run: |
          {
            echo "# Reporte de research FQ"
            echo "fecha: $(date -u +%FT%TZ)  exchange: ${EX}  symbol: ${SYM}  meses: ${MONTHS}"
            echo ""
            echo "## Real (motor de produccion)"; echo '```'
            cat research_out/research_real.txt 2>/dev/null || echo "(no disponible — ver download.txt)"
            echo '```'
            echo "## Demo sintetico (sanity)"; echo '```'
            cat research_out/demo_synthetic.txt 2>/dev/null || echo "(no disponible)"
            echo '```'
          } > research_out/REPORTE.md

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-report-${{ env.SLUG }}
          path: research_out/
          retention-days: 90

  # Si el job 'research' falla en rojo (infra o regresion real de la suite, ya
  # que los pasos de datos/run real son continue-on-error), abre/actualiza un
  # Issue con el link al run. Asi el fallo del run semanal NUNCA es silencioso y
  # queda como notificacion permanente de GitHub para revisarlo (o pedirle a
  # Claude que lo diagnostique con las tools de Actions).
  notify-failure:
    needs: research
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir/actualizar Issue de fallo
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "Research run fallo";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `El workflow **Research** fallo en rojo.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Commit: \`${context.sha}\``,
              ``,
              `Revisa los logs del run y el artefacto \`research-report\`.`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open",
              per_page: 100,
            });
            const existing = open.data.find(i => i.title.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `⚠️ ${marker} (${context.eventName})`, body,
              });
            }
