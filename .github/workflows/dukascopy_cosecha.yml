name: Dukascopy cosecha — cubo unsharded + edge base (XAU + NQ)

# Cosecha REAL (no probe): corre el motor sobre la historia de Dukascopy y arma
# el cubo de cada símbolo. UNSHARDED (--shards 1) -> correcto por construcción:
# el --verify mostró que el sharding NO reproduce en data con huecos TradFi
# (fines de semana/breaks); el 1-shard es la verdad. Más lento, pero exacto.
#
# Por símbolo: fetch del stack 5m/15m/1h -> cosecha_shard --shards 1 -> cube_report
# (edge base GROSS, pre-coste: radar, no veredicto neto). Sube los cubos + reportes
# como artifact. NQ resuelve a USATECH (Nasdaq "USA 100 Technical Index").
#
# Self-hosted (Hetzner) — el sandbox bloquea dukascopy. ENCENDE el CCX33.
# ~15-25 min por símbolo a step=1 (single-thread); 2 símbolos caben de sobra.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Símbolos (espacio). Alias: NQ, ES, WTI(->LIGHT), XAG/USD. XAU/USD probado."
        default: "XAU/USD NQ ES WTI XAG/USD"
      years:
        description: "Años de historia (sube el n para el gate; 5 = run largo ~h, una vez por el cache)"
        default: "5"
      step:
        description: "Step del replay (1=densidad máxima/más eventos, 2=más rápido)"
        default: "1"

permissions:
  contents: read

jobs:
  cosecha:
    runs-on: self-hosted
    timeout-minutes: 600
    env:
      SYMBOLS: ${{ inputs.symbols }}
      YEARS: ${{ inputs.years }}
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12 via uv (self-hosted)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          UV="$HOME/.local/bin/uv"
          "$UV" python install 3.12
          "$UV" venv --seed --clear --python 3.12 "$HOME/fqvenv"
          echo "$HOME/fqvenv/bin" >> "$GITHUB_PATH"
      - name: Install deps (motor + dukascopy)
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1 \
            || echo "[apt skip] sin sudo/apt (self-hosted): asume libgomp1 preinstalado"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest lightgbm scikit-learn turbovec dukascopy-python
      - name: Resolver instrumentos IDX (ground truth para NQ/ES)
        run: python tools/fetch_dukascopy.py --list-idx || true
      - name: Cosecha PARALELA por símbolo (cada uno unsharded=correcto) + cube_report
        run: |
          mkdir -p cosecha_cubes research_out "$HOME/fq_dukascopy_cubes"
          MAXJ="${MAXJOBS:-4}"   # cap de concurrencia (RAM del CCX33 ~32GB; metales pesados)
          # 1) FETCH del stack 5m/15m/1h por símbolo — SECUENCIAL (rápido; no martilla Dukascopy)
          for SYM in $SYMBOLS; do
            for TF in 5m 15m 1h; do
              P=$(python -c "import bt_data; print(bt_data.dataset_path('data','dukascopy','${SYM}','${TF}'))")
              if [ -f "$P" ]; then echo "== cache hit $SYM $TF =="; continue; fi
              echo "== fetch $SYM $TF (${YEARS}a) =="
              python tools/fetch_dukascopy.py --symbol "$SYM" --tf "$TF" --years "$YEARS" \
                || echo "!! fetch falló $SYM $TF"
            done
          done
          # 2) COSECHA en PARALELO por símbolo. Cada símbolo es UNSHARDED (--shards 1) =
          #    correcto por construcción; los símbolos son independientes, así que
          #    paralelizarlos es seguro. (NO usamos date-sharding: no reproduce en data
          #    con huecos por el estado acumulado del motor — lo cazó el --verify.)
          running=0
          for SYM in $SYMBOLS; do
            SLUG=$(echo "$SYM" | tr '/:' '__')
            P5=$(python -c "import bt_data; print(bt_data.dataset_path('data','dukascopy','${SYM}','5m'))")
            P15=$(python -c "import bt_data; print(bt_data.dataset_path('data','dukascopy','${SYM}','15m'))")
            P1=$(python -c "import bt_data; print(bt_data.dataset_path('data','dukascopy','${SYM}','1h'))")
            if [ ! -f "$P5" ] || [ ! -f "$P15" ] || [ ! -f "$P1" ]; then
              echo "== skip $SYM (klines incompletas — ¿no resolvió?) =="; continue
            fi
            (
              CUBE="cosecha_cubes/tp_cube_${SLUG}.parquet"
              CACHE="$HOME/fq_dukascopy_cubes/tp_cube_${SLUG}_${YEARS}y_s${STEP}.parquet"
              if [ -f "$CACHE" ]; then
                echo "== cube cache-hit $SYM (omito cosecha) =="; cp "$CACHE" "$CUBE"
              elif python tools/cosecha_shard.py --exchange dukascopy --symbol "$SYM" \
                     --tf-id 5m --shards 1 --workers 1 --step "$STEP" --out "$CUBE"; then
                cp "$CUBE" "$CACHE"
              else
                echo "!! cosecha FALLÓ $SYM"; exit 0
              fi
              echo "== cube_report $SYM (edge base GROSS) =="
              python tools/cube_report.py "$CUBE" || true
            ) > "research_out/cosecha_${SLUG}.txt" 2>&1 &
            echo "== lanzado $SYM (pid $!) =="
            running=$((running + 1))
            if [ "$running" -ge "$MAXJ" ]; then wait -n || true; running=$((running - 1)); fi
          done
          wait
          # 3) volcar los logs por símbolo (a archivo -> no se interleavean)
          for f in research_out/cosecha_*.txt; do
            [ -f "$f" ] && { echo "================= $f ================="; cat "$f"; }
          done
          echo "==== cubos producidos ===="
          ls -lh cosecha_cubes/ || echo "(sin cubos)"
          if ! ls cosecha_cubes/*.parquet >/dev/null 2>&1; then
            echo "!! NINGÚN cubo producido — rojo honesto"; exit 1
          fi
      - name: Gate POC-distance + KL (TradFi) sobre los cubos
        run: |
          set -o pipefail
          ARGS=""
          for SYM in $SYMBOLS; do
            SLUG=$(echo "$SYM" | tr '/:' '__')
            CUBE="cosecha_cubes/tp_cube_${SLUG}.parquet"
            KL=$(python -c "import bt_data; print(bt_data.dataset_path('data','dukascopy','${SYM}','5m'))")
            if [ -f "$CUBE" ] && [ -f "$KL" ]; then
              ARGS="$ARGS --pair $SLUG $CUBE $KL"
            else
              echo "== gate skip $SYM (falta cubo o klines) =="
            fi
          done
          if [ -n "$ARGS" ]; then
            echo "== gate_poc_distance: POC-distance + KL, ortogonalidad, CPCV/PBO =="
            echo "   (n bajo en TradFi -> RADAR; mira consistencia far>near por símbolo)"
            python tools/gate_poc_distance.py $ARGS 2>&1 | tee research_out/gate_tradfi.txt || true
          else
            echo "(sin cubos+klines para gatear)"
          fi
      - name: Subir cubos + reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-cosecha
          path: |
            cosecha_cubes/*.parquet
            data/dukascopy/*.parquet
            research_out/*.txt
          if-no-files-found: warn
          retention-days: 90
