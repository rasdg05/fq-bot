name: BNB cosecha (Hetzner) — 1 tap

# UN TAP, CERO inputs. Dispara "Research" para BNB/USDT a step1 en el runner
# self-hosted (Hetzner). Espejo de doge_cosecha; solo cambia el simbolo.
#
# MESES = 48 (NO 84): el perp de BNB en OKX es mas joven que 84m -> pedir 84
# baja n=0 (data antes del listing) y la cosecha sale sin cubo (el fallo de la
# Tanda 1). Mismo caso que DOGE=54, SOL=60, ETH=76 (meses por simbolo segun su
# listing en OKX). 48m -> ~2022..2026, cube denso. Si saliera vacio, baja a 36.
#
# IMPORTANTE: ENCENDE el CCX33 (Hetzner) y espera a que el runner figure ONLINE
# ANTES de darle Run. Si no, el job de research queda EN COLA hasta que aparezca.

on:
  workflow_dispatch: {}

permissions:
  actions: write      # para disparar otro workflow_dispatch
  contents: read

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar Research — BNB, cosecha, Hetzner, 48m, step1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research.yml \
            --repo "${{ github.repository }}" \
            --ref claude/turbovec-tp-cube-hardening-fvzdx7 \
            -f symbol=BNB/USDT \
            -f cosecha=true \
            -f sym_months=48 \
            -f sym_step=1
          echo "OK: disparado research.yml para BNB/USDT (cosecha, 48m, step1)."
          echo "Mira la pestana Actions -> 'Research' (corre en self-hosted/Hetzner)."
          echo "Si no arranca: confirma que el runner de Hetzner este ONLINE."
