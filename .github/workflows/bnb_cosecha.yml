name: BNB cosecha (Hetzner) — 1 tap

# UN TAP, CERO inputs. Dispara "Research" para BNB/USDT a step1 en el runner
# self-hosted (Hetzner). Espejo de doge_cosecha; solo cambia el simbolo.
#
# MESES = 36: el perp de BNB en OKX es MUY joven -> 84m y 48m dieron n=0 (data
# antes del listing). 36m -> ~2023..2026. Si AUN saliera vacio, el perp de BNB en
# OKX es demasiado corto para un cube profundo -> mejor saltarlo (como SUI/APT,
# "poca historia = cube fino, ruido para la tesis") o ir a 24m como ultimo intento.
#
# IMPORTANTE: ENCENDE el CCX33 (Hetzner) y espera a que el runner figure ONLINE
# ANTES de darle Run. Si no, el job de research queda EN COLA hasta que aparezca.

on:
  workflow_dispatch: {}

permissions:
  actions: write      # para disparar otro workflow_dispatch
  contents: read

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar Research — BNB, cosecha, Hetzner, 36m, step1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run research.yml \
            --repo "${{ github.repository }}" \
            --ref claude/turbovec-tp-cube-hardening-fvzdx7 \
            -f symbol=BNB/USDT \
            -f cosecha=true \
            -f sym_months=36 \
            -f sym_step=1
          echo "OK: disparado research.yml para BNB/USDT (cosecha, 36m, step1)."
          echo "Mira la pestana Actions -> 'Research' (corre en self-hosted/Hetzner)."
          echo "Si no arranca: confirma que el runner de Hetzner este ONLINE."
