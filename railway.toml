[build]
builder = "NIXPACKS"

# watchPatterns (ENGINEERING_PLAN N1): un push de SOLO documentacion/research
# tooling NO debe reiniciar el worker en vivo. Estrategia blacklist: se
# deploya TODO ("**") salvo lo que seguro no toca el runtime — si manana se
# anade un tipo de archivo nuevo al runtime, deploya por defecto (fallo
# seguro). OJO: tests/ y tools/ corren en CI de GitHub, no en el worker;
# .github/ es CI; internal/ y *.md son documentacion.
watchPatterns = [
  "**",
  "!**/*.md",
  "!internal/**",
  "!.github/**",
  "!tests/**",
  "!tools/**",
  # Obras/documentacion: PDFs, decks, figuras, memoria de procesos. NO tocan el
  # runtime -> NO deben re-desplegar el worker. (Antes solo se excluia *.md, asi que
  # los .pdf/.html/.png de MEMORY churneaban el bot y reseteaban sus contadores.)
  "!MEMORY/**",
  "!presentaciones/**",
  "!**/*.pdf",
  "!**/*.html",
  "!**/*.png",
  # EXCEPCION: funding_paper.py SI es runtime (launcher lo lanza como hijo con
  # FQ_FUNDING_PAPER=1) -> un fix suyo debe redeployar, a diferencia del resto de
  # tools/ (research, corre en CI). Re-incluir gana por ser el ultimo match.
  "tools/funding_paper.py",
  # EXCEPCION: cockpit.html SI es runtime — el cockpit_server (hijo no-critico con
  # FQ_COCKPIT=1) lo sirve LEYENDOLO DEL DISCO en cada GET, asi que un rediseño del
  # portal DEBE redeployar para que el contenedor tenga el HTML nuevo. El resto de
  # .html (previews de MEMORY) sigue excluido. Sin esto, un cambio que solo toca
  # cockpit.html sale "No changes to watched files" -> SKIPPED y el portal nunca se
  # actualiza (pasó con #165: quitar el pie legal quedó desplegado a medias).
  "cockpit.html",
  # EXCEPCION: tools/cockpit_server.py SI es runtime (el launcher lo lanza como hijo
  # con FQ_COCKPIT=1, ver launcher.py) -- a diferencia del resto de tools/ (research,
  # corre en CI), un fix a las rutas del server (p.ej. las guías PDF) debe redeployar.
  "tools/cockpit_server.py",
]

# UN SOLO SERVICIO. El launcher arranca VIP + maintenance siempre, y el bot
# PUBLIC solo si tiene token PROPIO (TELEGRAM_TOKEN_PUBLIC distinto del VIP);
# sin el, topologia de UN solo bot (decision jun-2026: todo por tiers en el
# VIP). Razon del servicio unico: Railway no comparte volumenes entre
# servicios y el publico (cuando corre) lee /data/fq_ledger.db del VIP.
#
# Variables que el servicio Railway debe tener:
#   VIP:    TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, ANTHROPIC_API_KEY, FQ_LEDGER_PATH
#   PUBLIC (OPCIONAL, solo con bot propio de BotFather): TELEGRAM_TOKEN_PUBLIC,
#           FQ_VIP_BOT_USERNAME, FQ_PUBLIC_DB_PATH=/data/fq_public.db,
#           FQ_VIP_LEDGER_PATH=/data/fq_ledger.db
[deploy]
startCommand = "python launcher.py"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
