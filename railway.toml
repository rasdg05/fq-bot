[build]
builder = "NIXPACKS"

# UN SOLO SERVICIO con AMBOS bots (VIP + PUBLIC) corriendo como subprocesos.
# Razon: Railway no soporta compartir un volumen entre servicios, asi que el
# bot publico vive en el mismo container que el VIP para poder leer /data/fq_ledger.db.
#
# Variables que el servicio Railway debe tener:
#   VIP:    TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, ANTHROPIC_API_KEY, FQ_LEDGER_PATH
#   PUBLIC: TELEGRAM_TOKEN_PUBLIC, FQ_VIP_BOT_USERNAME,
#           FQ_PUBLIC_DB_PATH=/data/fq_public.db, FQ_VIP_LEDGER_PATH=/data/fq_ledger.db
[deploy]
startCommand = "python launcher.py"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
