<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root{ --bg:#080a0e; --hair:#222a35; --ink:#f3f6f8; --accent:#d4af37; --glow:rgba(212,175,55,.30); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-print-color-adjust:exact; }
  html,body{ background:#000; }
  .pfp{ width:1000px; height:1000px; position:relative; overflow:hidden;
    background:radial-gradient(60% 60% at 50% 42%, var(--glow), transparent 62%), var(--bg);
    font-family:"Helvetica Neue",Arial,sans-serif; }
  .grid{ position:absolute; inset:0; background-image:
      linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
    background-size:84px 84px; opacity:.07; }
  /* circular crop guides: keep all content well inside this ring */
  .ring{ position:absolute; inset:60px; border-radius:50%; border:3px solid rgba(212,175,55,.22); }
  /* subtle equity-curve arc bottom, echoes the banner */
  .curve{ position:absolute; left:0; bottom:0; width:1000px; height:1000px; opacity:.85; }
  .mark{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:3; }
  .row{ display:flex; align-items:center; gap:34px; }
  .bar{ width:26px; height:300px; background:var(--accent); border-radius:13px; box-shadow:0 0 60px rgba(212,175,55,.85); }
  .fq{ font-weight:800; font-size:360px; letter-spacing:-18px; color:var(--ink); line-height:.8; }
  .kick{ font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; color:var(--accent);
    letter-spacing:14px; text-transform:uppercase; font-size:34px; font-weight:700; margin-top:40px; }
</style>
</head>
<body>
<div class="pfp">
  <div class="grid"></div>
  <svg class="curve" viewBox="0 0 1000 1000" preserveAspectRatio="none">
    <path d="M120,760 L260,720 L380,748 L500,660 L600,700 L720,600 L840,648 L900,560"
      fill="none" stroke="#d4af37" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  </svg>
  <div class="ring"></div>
  <div class="mark">
    <div class="row"><div class="bar"></div><div class="fq">FQ</div></div>
    <div class="kick">Fibonacci Quantum</div>
  </div>
</div>
</body>
</html>
