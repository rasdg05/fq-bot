# Configuración del servicio de Marea en Railway.
#
# Es un servicio SEPARADO del bot de Python: el de la raíz corre
# `python launcher.py` y no sirve nada por web. Para que Railway use este
# archivo, el servicio tiene que apuntar a `marea` como Root Directory.
#
# Un solo servicio sirve la app y corre el ciclo de vida (liquidar y reponer)
# cada hora dentro del mismo proceso — ver `server.mjs`.

[build]
builder = "NIXPACKS"
# Sólo construir. Nixpacks ya instala las dependencias en su propia fase, y
# meter `npm ci` aquí truena: nixpacks monta un caché en
# /app/node_modules/.cache y `npm ci` borra node_modules entero, así que no
# puede quitar ese directorio montado y sale con EBUSY.
buildCommand = "npm run build"

# Sólo redeploya cuando cambia la app. Los documentos del vault y los datos que
# el propio ciclo escribe no tienen por qué reiniciar el servicio.
watchPatterns = [
  "marea/**",
  "!marea/vault/**",
  "!marea/**/*.md",
  "!marea/data/**",
  "!marea/public/mercados.json",
  "!marea/public/resoluciones.json",
]

# Variables que conviene poner en el servicio:
#   MAREA_SECRETO   — firma las sesiones. Sin esto, cada redeploy saca a todos.
#   MAREA_DATA_DIR  — /data si montas un volumen, para que las cuentas y las
#                     apuestas sobrevivan a los redeploys. Es lo que hace que
#                     esto sea un producto y no una demo.
#
# Cripto en vivo (velas de 5 y 15 min). Todas tienen default sano: sin ninguna,
# el precio sale de Kraken y las velas corren igual. Ver vault/CRYPTO_LIVE.md.
#   MAREA_FQ_PRECIOS_URL — endpoint del motor propio de precios. Es la fuente
#                     primaria del spot; sin ella el respaldo público es la
#                     única fuente. La liquidación siempre lee Kraken.
#   MAREA_PRECIO_MS      — cada cuánto se lee el spot (default 3000).
#   MAREA_PLAN_VIVO_MS   — cada cuánto se planifica la vela siguiente (1000).
#   MAREA_CICLO_VIVO_MS  — cada cuánto se leen los cierres y se paga (10000).

[deploy]
startCommand = "npx tsx server/index.mts"
healthcheckPath = "/salud"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
